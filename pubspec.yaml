  image_picker: ^1.1.2 # Apache 2.0
  path_provider: ^2.0.11 # BSD
  image: ^4.0.15 # Apache 2.0
  transparent_image: ^2.0.0 # MIT
  photo_view: ^0.15.0 # MIT
  flutter_image_compress: ^2.5.1 # MIT
  shared_preferences: ^2.5.5 # BSD
  archive: ^4.0.5 # Apache 2.0
  file_picker: ^12.3.0 # MIT
  bottom_navy_bar: ^6.0.0 # Apache 2.0
  intro_slider: ^4.2.1 # MIT
  autocomplete_textfield_ns: ^2.0.0 # MIT
  hive: ^2.2.3 # Apache 2.0
  build_runner: ^2.2.0 # BSD
  flutter_bloc: ^9.1.0 # MIT
  equatable: ^2.0.5 # MIT
  flutter_launcher_icons: ^0.14.3 # MIT
  like_button: ^2.0.4 # MIT
  flutter_staggered_grid_view: ^0.7.0 # MIT
  flutter_staggered_animations: ^1.1.1 # MIT
  flutter_material_design_icons: ^3.1.0+7447 # MIT
  another_flushbar: ^2.2.4 # Apache 2.0
  flutter_spinkit: ^5.1.0 # MIT
  percent_indicator: ^4.2.2 # BSD
  draggable_scrollbar: ^0.1.0 # MIT
  share_plus: ^13.3.0 # BSD-3
  flutter_sticky_header: ^0.8.0 # MIT
  url_launcher: ^6.1.5 # BSD
  pull_to_refresh: ^2.0.0 # MIT
  showcaseview: ^5.1.0 # BSD
  in_app_purchase: ^3.0.8 # BSD
  video_player: ^2.4.7 # BSD
  permission_handler: ^11.4.0 # MIT
  flutter_sequence_animation: ^4.0.0-nullsafety # MIT
  flutter_native_splash: ^2.4.8 # MIT
  flutter_colorpicker: ^1.0.3 # MIT
  wakelock_plus: ^1.2.11 # BSD
  pdf: ^3.8.3 # Apache 2.0
  printing: ^5.10.4 # Apache 2.0
  # buy_me_a_coffee_widget: ^2.0.0-nullsafety.0 # MIT
  rate_my_app: ^2.4.1 # MIT
  # google_fonts: ^1.0.0 # Apache 2.0
  animated_text_kit: ^4.2.2 # MIT
  page_transition: ^2.2.2 # BSD
  reorderables: ^0.6.0 # MIT
  table_calendar: ^3.0.7
  omni_datetime_picker: ^2.0.7 # MIT
  fraction: ^5.0.3 # MIT
  dio: ^5.8.0+1
  googleapis: ^14.0.0
  google_sign_in: ^6.1.0 # BSD-3
  http_parser: ^4.0.0
  googleapis_auth: ^1.4.0
  flutter_secure_storage: ^11.1.1
  google_mobile_ads: ^8.0.0 # Apache 2.0
  collection: ^1.15.0-nullsafety.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter_native_splash:
  color: "ff6f00"

flutter_icons:
  ios: true
  android: true
  image_path_ios: "assets/launcher/iconIos.png"
  image_path_android: "assets/launcher/adaptiveForeground.png"
  adaptive_icon_background: "assets/launcher/adaptiveBackground.png"
  adaptive_icon_foreground: "assets/launcher/adaptiveForeground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/tomato.png
    - images/milk.png
    - images/meat.png
    - images/randomFood.jpg
    - images/rightArrow.png
    - images/cookingHat.png
    - images/lock.png
    - images/letter.png
    - images/cuisine.jpg
    - images/export.png
    - images/bag.png
    - images/shield.png
    - images/cards.png
    - images/theme.png
    - images/icon.png
    - images/bannerAd.png
    - images/tableVegetable.jpg
    - images/ingredient_search.mp4
    - images/salatLowRes.jpg
    - assets/firstStartRecipes.zip
    - images/foodBlur0.jpg
    - images/foodBlur1.jpg
    - images/foodBlur2.jpg
    - images/foodBlur3.jpg
    - images/iconIosStyle.png
    - images/finishFlag.png
    - images/tabletIngredientSearch.png
    - images/hearts.png
    - images/vegetables.png
    - images/vegetablesBright.png
    - images/google_logo.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Questrial
      fonts:
        - asset: fonts/Questrial-Regular.ttf
    - family: Ribeye
      fonts:
        - asset: fonts/Ribeye-Regular.ttf
    - family: RibeyeMarrow
      fonts:
        - asset: fonts/RibeyeMarrow-Regular.ttf
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf
    - family: Rancho
      fonts:
        - asset: fonts/Rancho-Regular.ttf
    - family: Righteous
      fonts:
        - asset: fonts/Righteous-Regular.ttf
    - family: Quando
      fonts:
        - asset: fonts/Quando-Regular.ttf
    - family: Lato
      fonts:
        - asset: fonts/Lato-Regular.ttf
        - asset: fonts/Lato-Bold.ttf
    - family: Quicksand
      fonts:
        - asset: fonts/Quicksand-Regular.ttf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_intl:
  enabled: true
