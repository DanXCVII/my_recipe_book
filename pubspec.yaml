flutter_native_splash:
  color: "#8E0038"
  image: "assets/launcher/newAdaptiveForeground.png"
  android_12:
    color: "#8E0038"
    image: "assets/launcher/newAdaptiveForeground.png"

flutter_launcher_icons:
  ios: true
  android: true
  image_path_ios: "images/new_logo_simplistic.png"
  image_path_ios_dark_transparent: "assets/launcher/newAdaptiveForeground.png"
  image_path_ios_tinted_grayscale: "assets/launcher/newAdaptiveMonochrome.png"
  desaturate_tinted_to_grayscale_ios: true
  image_path_android: "images/new_logo_simplistic.png"
  adaptive_icon_background: "#8E0038"
  adaptive_icon_foreground: "assets/launcher/newAdaptiveForeground.png"
  adaptive_icon_monochrome: "assets/launcher/newAdaptiveMonochrome.png"
  remove_alpha_ios: true
  background_color_ios: "#8E0038"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - images/randomFood.jpg
    - images/cuisine.jpg
    - images/new_logo.png
    - images/new_logo_simplistic.png
    - images/bannerAd.png
    - images/salatLowRes.jpg
    - assets/firstStartRecipes.zip
    - assets/plates/recipe-thumbnail.png
    - assets/audio/timer_complete.wav
    - images/google_logo.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.
  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages
  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: fonts/PlayfairDisplay-VariableFont_wght.ttf
          weight: 500
        - asset: fonts/PlayfairDisplay-VariableFont_wght.ttf
          weight: 600
        - asset: fonts/PlayfairDisplay-VariableFont_wght.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 400
        - asset: fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 500
        - asset: fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 600
        - asset: fonts/PlusJakartaSans-VariableFont_wght.ttf
          weight: 700
    - family: Questrial
      fonts:
        - asset: fonts/Questrial-Regular.ttf
    - family: Ribeye
      fonts:
        - asset: fonts/Ribeye-Regular.ttf
    - family: RibeyeMarrow
      fonts:
        - asset: fonts/RibeyeMarrow-Regular.ttf
    - family: Orbitron
      fonts:
        - asset: fonts/Orbitron-Regular.ttf
    - family: Rancho
      fonts:
        - asset: fonts/Rancho-Regular.ttf
    - family: Righteous
      fonts:
        - asset: fonts/Righteous-Regular.ttf
    - family: Quando
      fonts:
        - asset: fonts/Quando-Regular.ttf
    - family: Lato
      fonts:
        - asset: fonts/Lato-Regular.ttf
        - asset: fonts/Lato-Bold.ttf
    - family: Quicksand
      fonts:
        - asset: fonts/Quicksand-Regular.ttf
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
flutter_intl:
  enabled: true
