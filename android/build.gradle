allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Some AGP 9-ready plugins assume built-in Kotlin solely from the AGP
    // version. This project must keep compatibility mode while older plugins
    // still apply kotlin-android themselves, so ensure every Android library
    // gets the Kotlin plugin in that mode.
    project.pluginManager.withPlugin('com.android.library') {
        if (!project.plugins.hasPlugin('org.jetbrains.kotlin.android')) {
            project.pluginManager.apply('org.jetbrains.kotlin.android')
        }
    }
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
